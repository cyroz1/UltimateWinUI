name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog-check:
    name: Catalog matches generator output
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      # The committed catalog must be exactly what the generator produces
      # from the bundled scripts, so a hand-edited or stale tweaks.json
      # (including its upstream provenance fields) blocks the release.
      - name: Regenerate catalog and compare
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/regen/scripts"
          python3 tools/catalog_gen.py \
            src/UltimateWinUI/Assets/Scripts \
            "$RUNNER_TEMP/regen/scripts" \
            "$RUNNER_TEMP/regen/tweaks.json"
          if ! cmp -s "$RUNNER_TEMP/regen/tweaks.json" src/UltimateWinUI/Assets/tweaks.json; then
            echo "::error::src/UltimateWinUI/Assets/tweaks.json does not match a regeneration from Assets/Scripts. Re-run tools/catalog_gen.py and commit the result."
            diff <(python3 -m json.tool src/UltimateWinUI/Assets/tweaks.json) \
                 <(python3 -m json.tool "$RUNNER_TEMP/regen/tweaks.json") | head -n 100 || true
            exit 1
          fi

  build-installer:
    name: Build ${{ matrix.arch }} installer
    needs: catalog-check
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runtime: win-x64
            platform: x64
            allowed_arch: x64compatible
            install_mode: x64compatible
          - arch: arm64
            runtime: win-arm64
            platform: arm64
            allowed_arch: arm64
            install_mode: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      # Pinned so a compromised or changed package cannot silently alter
      # the installer toolchain between releases.
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --version=6.2.1 --yes --no-progress

      - name: Publish and create installer
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          RUNTIME: ${{ matrix.runtime }}
          PLATFORM: ${{ matrix.platform }}
          ALLOWED_ARCH: ${{ matrix.allowed_arch }}
          INSTALL_MODE: ${{ matrix.install_mode }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([.-].*)?$') {
            throw "Release tag '$env:GITHUB_REF_NAME' must use vMAJOR.MINOR.PATCH format."
          }

          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/$env:RUNTIME"
          $installerDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/installers"
          New-Item -ItemType Directory -Force -Path $publishDir, $installerDir | Out-Null

          dotnet publish src/UltimateWinUI/UltimateWinUI.csproj `
            --configuration Release `
            --runtime $env:RUNTIME `
            --self-contained true `
            -p:Platform=$env:PLATFORM `
            -p:Version=$version `
            --output $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc `
            "/DAppVersion=$version" `
            "/DPublishDir=$publishDir" `
            "/DOutName=UltimateWinUI-$env:ARCH-Setup-$version" `
            "/DArchAllowed=$env:ALLOWED_ARCH" `
            "/DIn64Bit=$env:INSTALL_MODE" `
            "/O$installerDir" `
            installer/UltimateWinUI.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The digest is computed in the same job that built the installer,
      # so the publish job can prove the bytes it releases are the bytes
      # that were built.
      - name: Record installer SHA256
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $installerDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/installers"
          Get-ChildItem $installerDir -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath (Join-Path $installerDir "SHA256SUMS-$env:ARCH.txt") -Encoding ascii -Append
          }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.arch }}-installer
          path: |
            artifacts/installers/*.exe
            artifacts/installers/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs: build-installer
    runs-on: ubuntu-latest
    # Releases require a human approval in the "release" environment
    # before anything is published.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-installer'
          path: artifacts
          merge-multiple: true

      - name: Create release with notes and installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected_x64="UltimateWinUI-x64-Setup-${version}.exe"
          expected_arm64="UltimateWinUI-arm64-Setup-${version}.exe"
          mapfile -t installers < <(find artifacts -maxdepth 1 -type f -name '*.exe' -printf '%f\n' | sort)

          if [[ "${installers[*]}" != "${expected_arm64} ${expected_x64}" ]]; then
            printf 'Expected exactly %s and %s; found: %s\n' \
              "$expected_x64" "$expected_arm64" "${installers[*]}" >&2
            exit 1
          fi

          # Refuse to publish anything whose bytes do not match the
          # digest recorded by the build job that produced it.
          : > artifacts/SHA256SUMS.txt
          for manifest in artifacts/SHA256SUMS-x64.txt artifacts/SHA256SUMS-arm64.txt; do
            if [[ ! -f "$manifest" ]]; then
              printf 'Missing build digest manifest %s; refusing to publish.\n' "$manifest" >&2
              exit 1
            fi
            cat "$manifest" >> artifacts/SHA256SUMS.txt
          done
          while read -r expected_hash file_name; do
            actual_hash=$(sha256sum "artifacts/$file_name" | awk '{print $1}')
            if [[ "$actual_hash" != "$expected_hash" ]]; then
              printf 'SHA256 mismatch for %s (manifest %s, actual %s); refusing to publish.\n' \
                "$file_name" "$expected_hash" "$actual_hash" >&2
              exit 1
            fi
          done < artifacts/SHA256SUMS.txt

          if previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" --match 'v[0-9]*' 2>/dev/null); then
            commit_range="${previous_tag}..${GITHUB_REF_NAME}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}"
          else
            commit_range="$GITHUB_REF_NAME"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          fi

          changes=$(git log --no-merges --format='- %s (%h)' "$commit_range")
          if [[ -z "$changes" ]]; then
            changes='- No non-merge commits in this release range.'
          fi

          {
            printf '# UltimateWinUI %s\n\n' "$GITHUB_REF_NAME"
            printf '## Changes\n\n%s\n\n' "$changes"
            printf '## SHA256 checksums\n\n```\n'
            cat artifacts/SHA256SUMS.txt
            printf '```\n\n'
            printf '**Full Changelog:** %s\n' "$compare_url"
          } > release-notes.md

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Never overwrite assets on an existing release: a published
            # installer must stay byte-identical so its published digest
            # keeps meaning something. Re-running against an asset-less
            # release (e.g. a failed first attempt) only fills it in.
            existing_assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
            if [[ "$existing_assets" != "0" ]]; then
              printf 'Release %s already has %s asset(s); refusing to overwrite published assets. Delete the release manually if a re-release is intended.\n' \
                "$GITHUB_REF_NAME" "$existing_assets" >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "UltimateWinUI $GITHUB_REF_NAME" \
              --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" \
              "artifacts/$expected_x64" \
              "artifacts/$expected_arm64" \
              "artifacts/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" \
              "artifacts/$expected_x64" \
              "artifacts/$expected_arm64" \
              "artifacts/SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --title "UltimateWinUI $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
